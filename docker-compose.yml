version: '3.9'

services:
  # PostgreSQL Database with PostGIS
  postgres:
    image: postgis/postgis:15-3.3
    container_name: farm-rental-postgres
    environment:
      POSTGRES_DB: farm_rental_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - farm-rental-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Elasticsearch for Full-Text Search
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.0
    container_name: farm-rental-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - farm-rental-network
    healthcheck:
      test: curl -s http://localhost:9200 >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

  # Apache Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: farm-rental-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - farm-rental-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: farm-rental-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - farm-rental-network
    healthcheck:
      test: kafka-topics --bootstrap-server localhost:9092 --list
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache (Optional but recommended)
  redis:
    image: redis:7.2-alpine
    container_name: farm-rental-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - farm-rental-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin for Database Management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: farm-rental-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@farmrental.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - farm-rental-network

  # Adminer for Database UI (Alternative to pgAdmin)
  adminer:
    image: adminer:latest
    container_name: farm-rental-adminer
    ports:
      - "8888:8080"
    depends_on:
      - postgres
    networks:
      - farm-rental-network

  # Kafdrop for Kafka Monitoring
  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    container_name: farm-rental-kafdrop
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: kafka:29092
      JVM_OPTS: "-Xms32M -Xmx64M"
    depends_on:
      - kafka
    networks:
      - farm-rental-network

networks:
  farm-rental-network:
    driver: bridge

volumes:
  postgres_data:
  elasticsearch_data:
  redis_data:

# Access Points After docker-compose up -d:
# 
# PostgreSQL:
#   Host: localhost:5432
#   User: postgres
#   Password: password
#   Database: farm_rental_db
#   pgAdmin: http://localhost:5050
#   Adminer: http://localhost:8888
#
# Elasticsearch:
#   URL: http://localhost:9200
#
# Kafka:
#   Bootstrap Servers: localhost:9092
#   Zookeeper: localhost:2181
#   Kafdrop UI: http://localhost:9000
#
# Redis:
#   Host: localhost:6379
#
# Useful Commands:
#   docker-compose up -d          # Start all services
#   docker-compose ps             # Show running services
#   docker-compose logs postgres  # View service logs
#   docker-compose down           # Stop all services
#   docker-compose down -v        # Stop and remove volumes
